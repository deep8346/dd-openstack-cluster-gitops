---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
secretGenerator:
  - name: kube-prometheus-stack-values-override
    type: Opaque
    files:
      - override.yaml=helm-values/override-values.yaml
    options:
      disableNameSuffixHash: true
resources:
  - alertmanager-http-route.yaml
  - custom/
  - grafana-admin-password.yaml
  - grafana-http-route.yaml
  - grafana-oauth-secret.yaml
  - prometheus-http-route.yaml
