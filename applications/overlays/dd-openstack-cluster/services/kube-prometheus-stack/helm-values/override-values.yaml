---
fullnameOverride: kube-prometheus-stack
alertmanager:
  enabled: true
  service:
    enabled: true
  alertmanagerSpec:
    externalUrl: https://alertmanager.dd-openstack-cluster.dfw3.k8s.opencenter.cloud
    # Pin the PVC storage class (see prometheusSpec.storageSpec note).
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: csi-cinder-sc-delete
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
        equal: [namespace, alertname]
      - source_matchers: [severity = warning]
        target_matchers: [severity = info]
        equal: [namespace, alertname]
      - source_matchers: [alertname = InfoInhibitor]
        target_matchers: [severity = info]
        equal: [namespace]
      - target_matchers: [alertname = InfoInhibitor]
      - source_matchers:
          - alertname =~ "NodeNotReady|KubeNodeNotReady"
        target_matchers:
          - alertname =~ "KubePodCrashLooping|KubePodNotReady|KubeContainerWaiting|KubePodOOMKilled"
        equal: [cluster]
      - source_matchers:
          - alertname =~ "NodeNotReady|KubeNodeNotReady"
        target_matchers:
          - alertname =~ "KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck"
        equal: [cluster]
      - source_matchers:
          - alertname = "KubeletDown"
        target_matchers:
          - alertname =~ "KubeletClientCertificateExpiration|KubeletServerCertificateExpiration|KubeletPlegDurationHigh|KubeletTooManyPods"
        equal: [cluster]
      - source_matchers:
          - alertname =~ "NodeDiskRunningFull|NodeFilesystemAlmostOutOfSpace"
        target_matchers:
          - alertname =~ "NodeFilesystemSpaceFillingUp|KubePersistentVolumeUsageHigh|KubePersistentVolumeFullInFourDays"
        equal: [cluster]
      - source_matchers:
          - alertname =~ "MimirIngesterRestarts|MimirIngesterUnhealthy"
        target_matchers:
          - alertname =~ "MimirRequestErrors|MimirSlowQueries|MimirWritePathLatencyHigh"
        equal: [namespace, cluster]
      - source_matchers:
          - alertname = "PodDisruptionBudgetAtLimit"
        target_matchers:
          - alertname =~ "KubeDaemonSetMisScheduled|KubeDaemonSetNotScheduled"
        equal: [namespace, cluster]
      - source_matchers:
          - alertname = "KubeNodeUnreachable"
        target_matchers:
          - alertname =~ "NodeNotReady|KubeNodeNotReady"
        equal: [node, cluster]
      - source_matchers:
          - alertname = "NodeNetworkInterfaceFlapping"
        target_matchers:
          - alertname =~ "NodeNetworkReceiveErrs|NodeNetworkTransmitErrs"
        equal: [instance, cluster]
      - source_matchers:
          - alertname = "KubePersistentVolumeErrors"
        target_matchers:
          - alertname =~ "KubePodNotReady|KubeContainerWaiting"
        equal: [namespace, cluster]
      - source_matchers:
          - severity =~ "warning|critical"
        target_matchers:
          - severity = "info"
          - alertname =~ "CPUThrottlingHigh"
        equal: [namespace, cluster]
    route:
      receiver: "null"
      group_by: [namespace, alertname, cluster, service]
      group_wait: 30s
      group_interval: 60s
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
        - receiver: alert_proxy_receiver
          continue: false
          group_by: [node, cluster]
          matchers:
            - alertname =~ "NodeNotReady|KubeNodeNotReady|KubeNodeUnreachable"
        - receiver: alert_proxy_receiver
          continue: false
          matchers:
            - alertname =~ "NodeDiskRunningFull|NodeFilesystemSpaceFillingUp|NodeFilesystemAlmostOutOfSpace|NodeClockSkewDetected|NodeClockNotSynchronising|KubePersistentVolumeErrors|KubeClientErrors|KubeAPIErrorsHigh|KubeAPILatencyHigh|KubeSchedulerDown|KubeControllerManagerDown|KubeProxyDown|KubeletDown|KubeVersionMismatch|KubeClientCertificateExpiration|KubeletClientCertificateExpiration|KubeletServerCertificateExpiration|KubeAggregatedAPIErrors|KubeAggregatedAPIDown|KubeNodePressure"
        - receiver: alert_proxy_receiver
          continue: false
          matchers:
            - alertname =~ "KubePodCrashLooping|KubePodNotReady|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeJobFailed|KubeQuotaAlmostFull|KubeQuotaFullyUsed|KubePodOOMKilled|KubeContainerWaiting|KubeHpaReplicasMismatch|KubeHpaMaxedOut|KubePersistentVolumeUsageHigh|KubePersistentVolumeFullInFourDays|KubePersistentVolumeInodesRunningFull|KubePersistentVolumeFillingUp"
            - namespace =~ "calico-apiserver|calico-system|cert-manager|envoy-gateway-system|external-snapshotter|flux-system|headlamp|kafka-system|keycloak|kube-system|kyverno|observability|olm|openstack-ccm|openstack-csi|operators|postgres-operator|rackspace|rackspace-system|rbac-system|tigera-operator|velero|vmware-system-csi"
        - receiver: alert_proxy_receiver
          continue: false
          matchers: [severity =~ "critical"]
    receivers:
      - name: "null"
      - name: alert_proxy_receiver
        webhook_configs:
          - url: http://rackspace-alert-proxy.rackspace.svc.cluster.local/alert/process
            send_resolved: true
prometheus:
  enabled: true
  service:
    enabled: true
  prometheusSpec:
    externalUrl: https://prometheus.dd-openstack-cluster.dfw3.k8s.opencenter.cloud
    externalLabels:
      cluster: dd-openstack-cluster
      region: DFW3
      customer: my-org
    # The three selector flags keep Prometheus discovering ServiceMonitors,
    # PodMonitors and Rules cluster-wide (Flux emits its own in flux-system).
    # They are intentionally unconditional: they are not Mimir-specific.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: csi-cinder-sc-delete
          resources:
            requests:
              storage: 150Gi
crds:
  upgradeJob:
    enabled: true
    forceConflicts: true
grafana:
  enabled: true
  service:
    enabled: true
  fullnameOverride: kube-prometheus-stack-grafana
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    alerts:
      enabled: true
      searchNamespace: ALL
  grafana.ini:
    log:
      level: info
      filters: debug
    server:
      root_url: https://grafana.dd-openstack-cluster.dfw3.k8s.opencenter.cloud
    security:
      csrf_trusted_origins: https://grafana.dd-openstack-cluster.dfw3.k8s.opencenter.cloud
      csrf_additional_headers: X-Forwarded-Host
    auth.generic_oauth:
      enabled: true
      name: SSO
      allow_sign_up: true
      use_refresh_token: true
      use_pkce: false
      client_id: $__file{/etc/secrets/grafana_oauth/client_id}
      client_secret: $__file{/etc/secrets/grafana_oauth/client_secret}
      scopes: openid email profile roles
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      id_token_attribute_name: sub
      auth_url: https://auth.dd-openstack-cluster.dfw3.k8s.opencenter.cloud/realms/opencenter/protocol/openid-connect/auth
      token_url: https://auth.dd-openstack-cluster.dfw3.k8s.opencenter.cloud/realms/opencenter/protocol/openid-connect/token
      api_url: https://auth.dd-openstack-cluster.dfw3.k8s.opencenter.cloud/realms/opencenter/protocol/openid-connect/userinfo
      # Roles come from two claims the realm actually emits: groups
      # (oidc-group-membership-mapper on the client) and roles
      # (oidc-usermodel-client-role-mapper scoped to grafana-oauth, so it
      # carries grafana-admin / grafana-editor / grafana-viewer). Realm groups
      # are matched with and without their leading slash because the mapper is
      # configured with full.path=false.
      role_attribute_path: (contains(groups[*], 'cluster-admins') || contains(groups[*], '/cluster-admins') || contains(roles[*], 'grafana-admin')) && 'Admin' || (contains(roles[*], 'grafana-editor')) && 'Editor' || (contains(roles[*], 'grafana-viewer')) && 'Viewer' || 'Viewer'
      role_attribute_strict: false
      allow_assign_grafana_admin: true
  extraSecretMounts:
    - name: grafana-oauth-secret-mount
      secretName: grafana-oauth-secret
      defaultMode: 0440
      mountPath: /etc/secrets/grafana_oauth
      readOnly: true
      # Project the Secret keys onto the exact filenames $__file opens above.
      # A Secret volume names each file after its key, so the mounted name has
      # to match the path in grafana.ini character for character. Committed
      # overlays carry these keys hyphenated (client-id/client-secret) while the
      # ini reads them with underscores, so the mount projected nothing Grafana
      # could open: it failed to expand auth.generic_oauth.client_id and
      # crash-looped, the kube-prometheus-stack install timed out, Flux's
      # uninstall remediation tore the release down, and the monitoring
      # dependsOn chain stayed blocked behind it. Projecting here rather than
      # renaming the keys keeps the mount working regardless of which spelling a
      # given overlay was committed with. The chart passes items through
      # verbatim (grafana/templates/_pod.tpl).
      items:
        - key: client-id
          path: client_id
        - key: client-secret
          path: client_secret
  admin:
    existingSecret: "grafana-admin-password"
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: csi-cinder-sc-delete
    size: 10Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          uid: loki-default
          type: loki
          access: proxy
          url: http://observability-loki-gateway.observability.svc.cluster.local
          isDefault: false
          jsonData:
            httpHeaderName1: "X-Scope-OrgID"
            maxLines: 1000
          secureJsonData:
            httpHeaderValue1: "default"
          editable: true
        - name: Tempo
          uid: tempo-default
          type: tempo
          access: proxy
          url: http://observability-tempo-query-frontend.observability.svc.cluster.local:3200
          isDefault: false
          jsonData:
            httpHeaderName1: x-scope-orgid
            maxLines: 1000
            pdcInjected: false
            tracesToLogsV2:
              customQuery: false
              datasourceUid: loki-default
              filterBySpanID: true
              filterByTraceID: true
            tracesToMetrics:
              datasourceUid: prometheus
          secureJsonData:
            httpHeaderValue1: "default"
          editable: true
kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          - image.toolkit.fluxcd.io
        resources:
          - gitrepositories
          - buckets
          - helmrepositories
          - helmcharts
          - ocirepositories
          - kustomizations
          - helmreleases
          - alerts
          - providers
          - receivers
          - imagerepositories
          - imagepolicies
          - imageupdateautomations
        verbs: [ "list", "watch" ]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Kustomization resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, lastAppliedRevision ]
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRelease resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, lastAppliedRevision ]
                  chart_name: [ spec, chart, spec, chart ]
                  chart_version: [ spec, chart, spec, version ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux GitRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: Bucket
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Bucket resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  endpoint: [ spec, endpoint ]
                  bucket_name: [ spec, bucketName ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmChart
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux HelmChart resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  chart_name: [ spec, chart ]
                  chart_version: [ spec, version ]
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux OCIRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  revision: [ status, artifact, revision ]
                  url: [ spec, url ]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1beta3
              kind: Alert
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Alert resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  suspended: [ spec, suspend ]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1beta3
              kind: Provider
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Provider resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  suspended: [ spec, suspend ]
          - groupVersionKind:
              group: notification.toolkit.fluxcd.io
              version: v1
              kind: Receiver
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux Receiver resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  webhook_path: [ status, webhookPath ]
          - groupVersionKind:
              group: image.toolkit.fluxcd.io
              version: v1
              kind: ImageRepository
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux ImageRepository resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  image: [ spec, image ]
          - groupVersionKind:
              group: image.toolkit.fluxcd.io
              version: v1
              kind: ImagePolicy
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux ImagePolicy resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  source_name: [ spec, imageRepositoryRef, name ]
          - groupVersionKind:
              group: image.toolkit.fluxcd.io
              version: v1
              kind: ImageUpdateAutomation
            metricNamePrefix: gotk
            metrics:
              - name: "resource_info"
                help: "The current state of a Flux ImageUpdateAutomation resource."
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [ metadata, name ]
                labelsFromPath:
                  exported_namespace: [ metadata, namespace ]
                  ready: [ status, conditions, "[type=Ready]", status ]
                  suspended: [ spec, suspend ]
                  source_name: [ spec, sourceRef, name ]
