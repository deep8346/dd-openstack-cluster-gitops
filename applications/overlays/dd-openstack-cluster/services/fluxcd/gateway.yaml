---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway-api-base
      namespace: flux-system
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./applications/overlays/dd-openstack-cluster/services/gateway
  prune: true
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: gateway
      app.kubernetes.io/managed-by: flux
      opencenter/managed-by: opencenter
