---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openstack-ccm-namespace
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./applications/overlays/dd-openstack-cluster/services/openstack-ccm/namespace
  prune: true
  wait: true
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: openstack-ccm
      app.kubernetes.io/managed-by: flux
      opencenter/managed-by: opencenter
