---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-base
  namespace: flux-system
spec:
  dependsOn:
    - name: sources
      namespace: flux-system
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: opencenter-kyverno
    namespace: flux-system
  path: applications/base/services/kyverno/policy-engine
  targetNamespace: kyverno
  prune: true
  wait: true
  force: true
  suspend: false
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: kyverno
      app.kubernetes.io/managed-by: flux
      opencenter/managed-by: opencenter
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-default-ruleset
  namespace: flux-system

spec:
  dependsOn:
    - name: sources
      namespace: flux-system
    - name: kyverno-base
      namespace: flux-system
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: opencenter-kyverno
    namespace: flux-system
  path: applications/base/services/kyverno/default-ruleset
  targetNamespace: kyverno
  prune: true
  wait: true
  force: true
  suspend: false
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: kyverno
      app.kubernetes.io/managed-by: flux
      opencenter/managed-by: opencenter
