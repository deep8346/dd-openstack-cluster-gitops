---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openstack-ccm-base
  namespace: flux-system
spec:
  dependsOn:
    - name: openstack-ccm-override
      namespace: flux-system
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: opencenter-openstack-ccm
    namespace: flux-system
  path: applications/base/services/openstack-ccm
  targetNamespace: openstack-ccm
  prune: true
  wait: true
  force: true
  suspend: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: openstack-cloud-controller-manager
        spec:
          install:
            remediation:
              retries: 5
              remediateLastFailure: false
          upgrade:
            remediation:
              # Leave a failed upgrade in place: rolling back the CCM re-taints
              # nothing but removes the evidence needed to diagnose it.
              retries: 0
              remediateLastFailure: false
      target:
        group: helm.toolkit.fluxcd.io
        version: v2
        kind: HelmRelease
        name: openstack-cloud-controller-manager

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openstack-cloud-controller-manager
      namespace: openstack-ccm
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: openstack-ccm
      app.kubernetes.io/managed-by: flux
      opencenter/managed-by: opencenter
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openstack-ccm-override
  namespace: flux-system
spec:
  dependsOn:
    - name: openstack-ccm-namespace
      namespace: flux-system
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./applications/overlays/dd-openstack-cluster/services/openstack-ccm
  targetNamespace: openstack-ccm
  prune: true
  wait: true
  force: true
  suspend: false
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: openstack-ccm
      app.kubernetes.io/managed-by: flux
      opencenter/managed-by: opencenter
